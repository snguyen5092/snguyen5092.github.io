# Base44 sandbox nginx config: serves the bind-mounted repo as a static site.
# Mounted at /etc/nginx/nginx.conf.
#
# `user root` is required here: the sandbox bind-mounts the repo read-only with
# root-only permissions, so nginx's default unprivileged worker cannot read it.
user  root;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile    on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Keeps repo metadata (.git, .base44) out of the public preview.
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
